<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img">
  <title>A Placeable: width and measuredWidth</title>
  <defs><pattern id="hatch-light" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5f6368" stroke-width="1.5"/></pattern><marker id="tick-light" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="10" orient="auto"><line x1="1" y1="0" x2="1" y2="10" stroke="#5f6368" stroke-width="2"/></marker><marker id="down-light" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b7285"/></marker><marker id="up-light" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b45309" stroke-width="2"/></marker></defs>
  <text x="40" y="22" text-anchor="start" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#1c1e21">width(100).margin(all = 7), at most 300 wide</text>
  <rect x="40" y="40" width="480" height="40" fill="none" stroke="#1c1e21" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="44" width="11.200000000000001" height="32" fill="url(#hatch-light)" stroke="none"/>
  <rect x="51.2" y="44" width="160" height="32" fill="#d6e4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="131.2" y="64" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1c1e21">box</text>
  <rect x="211.2" y="44" width="11.200000000000001" height="32" fill="url(#hatch-light)" stroke="none"/>
  <line x1="40" y1="36" x2="40" y2="84" stroke="#c2255c" stroke-width="3"/><path d="M 40 36 l 7 4 l -7 4 z" fill="#c2255c"/>
  <line x1="40" y1="96" x2="222.4" y2="96" stroke="#5f6368" stroke-width="1" marker-start="url(#tick-light)" marker-end="url(#tick-light)"/>
  <text x="230.4" y="100" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1c1e21">measuredWidth = 114, margins included</text>
  <text x="40" y="142" text-anchor="start" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#1c1e21">width(150), at most 100 wide</text>
  <rect x="40" y="160" width="160" height="40" fill="none" stroke="#1c1e21" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="164" width="240" height="32" fill="#d6e4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="160" y="184" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1c1e21">box</text>
  <line x1="40" y1="156" x2="40" y2="204" stroke="#c2255c" stroke-width="3"/><path d="M 40 156 l 7 4 l -7 4 z" fill="#c2255c"/>
  <line x1="40" y1="216" x2="200" y2="216" stroke="#5f6368" stroke-width="1" marker-start="url(#tick-light)" marker-end="url(#tick-light)"/>
  <text x="208" y="220" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1c1e21">width = 100, kept within the room</text>
  <line x1="40" y1="236" x2="280" y2="236" stroke="#5f6368" stroke-width="1" marker-start="url(#tick-light)" marker-end="url(#tick-light)"/>
  <text x="288" y="240" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1c1e21">measuredWidth = 150</text>
</svg>
