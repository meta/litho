<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img">
  <title>ActionBarLayout's two outcomes</title>
  <defs><pattern id="hatch-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#a8abb0" stroke-width="1.5"/></pattern><marker id="tick-dark" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="10" orient="auto"><line x1="1" y1="0" x2="1" y2="10" stroke="#a8abb0" stroke-width="2"/></marker><marker id="down-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66d9e8"/></marker><marker id="up-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#fbbf24" stroke-width="2"/></marker></defs>
  <text x="40" y="32" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">At most 120 wide: labelled, 120 wide, fits: shown</text>
  <rect x="40" y="46" width="360" height="68" fill="none" stroke="#e3e3e3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="50" width="360" height="60" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">labelled</text>
  <line x1="40" y1="42" x2="40" y2="118" stroke="#ff8fb8" stroke-width="3"/><path d="M 40 42 l 7 4 l -7 4 z" fill="#ff8fb8"/>
  <text x="40" y="152" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">At most 119 wide: labelled, 120 wide, doesn't fit: icons, 50 wide, shown</text>
  <rect x="40" y="166" width="357" height="38" fill="none" stroke="#e3e3e3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="170" width="150" height="30" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <text x="115" y="189" text-anchor="middle" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">icons</text>
  <rect x="40" y="168" width="360" height="34" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="40" y1="162" x2="40" y2="208" stroke="#ff8fb8" stroke-width="3"/><path d="M 40 162 l 7 4 l -7 4 z" fill="#ff8fb8"/>
  <text x="40" y="246" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#a8abb0">Dotted: the labelled buttons, measured under an unbounded width and not placed</text>
</svg>
