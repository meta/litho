<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img">
  <title>place and placeRelative</title>
  <defs><pattern id="hatch-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#a8abb0" stroke-width="1.5"/></pattern><marker id="tick-dark" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="10" orient="auto"><line x1="1" y1="0" x2="1" y2="10" stroke="#a8abb0" stroke-width="2"/></marker><marker id="down-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66d9e8"/></marker><marker id="up-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#fbbf24" stroke-width="2"/></marker></defs>
  <text x="20" y="20" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">A container 1000 wide, a child 100 wide: placeRelative(start = 30) or place(x = 30)</text>
  <text x="100" y="54" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Left to right, either call</text>
  <rect x="100" y="64" width="380" height="28" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <rect x="111.4" y="68" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="96" stroke="#ff8fb8" stroke-width="3"/><path d="M 100 60 l 7 4 l -7 4 z" fill="#ff8fb8"/>
  <text x="492" y="83" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">x = 30</text>
  <text x="100" y="116" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Right to left, placeRelative</text>
  <rect x="100" y="126" width="380" height="28" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <rect x="430.6" y="130" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <line x1="480" y1="122" x2="480" y2="158" stroke="#ff8fb8" stroke-width="3"/><path d="M 480 122 l -7 4 l 7 4 z" fill="#ff8fb8"/>
  <text x="492" y="145" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">x = 870</text>
  <text x="100" y="178" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Right to left, place</text>
  <rect x="100" y="188" width="380" height="28" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <rect x="111.4" y="192" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <line x1="480" y1="184" x2="480" y2="220" stroke="#ff8fb8" stroke-width="3"/><path d="M 480 184 l -7 4 l 7 4 z" fill="#ff8fb8"/>
  <text x="492" y="207" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">x = 30</text>
  <text x="20" y="254" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Right to left, when the final width differs from the declared one: the declared box (dotted) starts at the start edge</text>
  <text x="100" y="290" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Declared 100, stretched to 1000</text>
  <rect x="100" y="300" width="380" height="28" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <rect x="442" y="297" width="38" height="34" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="442" y="304" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <line x1="480" y1="296" x2="480" y2="332" stroke="#ff8fb8" stroke-width="3"/><path d="M 480 296 l -7 4 l 7 4 z" fill="#ff8fb8"/>
  <text x="492" y="319" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">either call: x = 900</text>
  <text x="100" y="362" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">Declared 1200, kept to 1000</text>
  <rect x="24" y="369" width="456" height="34" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="100" y="372" width="380" height="28" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <rect x="24" y="376" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <rect x="442" y="376" width="38" height="20" fill="#1e3a6e" stroke="#8fb3ff" stroke-width="1.5"/>
  <line x1="480" y1="368" x2="480" y2="404" stroke="#ff8fb8" stroke-width="3"/><path d="M 480 368 l -7 4 l 7 4 z" fill="#ff8fb8"/>
  <text x="24" y="422" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">place(0, 0): x = -200</text>
  <text x="492" y="391" text-anchor="start" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e3e3e3">placeRelative(0, 0): x = 900</text>
</svg>
